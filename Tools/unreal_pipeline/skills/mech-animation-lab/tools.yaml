tools:
  - name: animation_lab
    description: 실험용 FK 초안 작성·현재 상태 조회·애니메이션 FBX 출력을 수행한다.
    source_file: scripts/editor.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 90
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    input_schema:
      type: object
      required: [operation, request_path]
      properties:
        operation:
          type: string
          enum: [inspect, rig_workspace, create_clip, key_clip, export_clip, open_clip, import_mesh_candidate, bind_mesh_candidate, inspect_batch, create_batch_clip, key_batch_clip, export_batch_clip, rebind_batch_clip]
        request_path:
          type: string
          description: 프로젝트 automate/workspace 또는 기존 실험 workspace의 JSON 요청 절대 경로.
